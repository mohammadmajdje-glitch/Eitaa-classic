<!doctype html>
<html lang="fa" dir="rtl" data-t="d">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PES Classic</title>
<meta name="theme-color" content="#c9a227">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#fffdf6;--cd:#fff;--tx:#0d2a6e;--mu:#6b7aa5;--ac:#c9a227;--b2:#1f4fd8;--ln:#e8e1c4;--bad:#c0392b;--hf:#fff;--on:#fff}
[data-t=n]{--bg:#0a0c0d;--cd:#14191b;--tx:#e8f6f5;--mu:#7fa09d;--ac:#e5bd3a;--b2:#19d3c5;--ln:#243034;--hf:#0a0c0d;--on:#0a0c0d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(135deg,var(--ac),var(--b2));color:var(--hf)}
header img{width:40px;height:40px;border-radius:50%;border:2px solid var(--hf)}
header h1{flex:1;margin:0;font:900 20px Orbitron,sans-serif;letter-spacing:1px}
header button{background:none;border:0;font-size:22px;cursor:pointer}
main{max-width:680px;margin:0 auto;padding:12px}
h2,h3{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;margin:4px 0 8px}
h3{font-size:19px}h2{font-size:26px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:12px}
.tb{display:flex;gap:6px;margin:10px 0}
.tb button{flex:1;padding:9px 4px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;font:inherit;font-size:14px;cursor:pointer}
.tb button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:center}
th,td{padding:8px 3px;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-size:12px;font-weight:700}
td.tn{text-align:right;font-weight:700;white-space:nowrap}
td.pt,b.pt{color:var(--ac);font:900 16px Orbitron,sans-serif}
tr:last-child td{border-bottom:0}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;cursor:pointer;text-align:center}
.sc{font:900 20px Orbitron,sans-serif;background:var(--bg);border-radius:10px;padding:2px 12px;color:var(--ac)}
.mu,small{color:var(--mu);font-size:12px;text-align:center}
.ev{border-top:1px dashed var(--ln);margin-top:8px;padding-top:6px}
.rw{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.rk{width:26px;font-family:Orbitron,sans-serif;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;max-width:100%;min-width:0}
.rw input[type=number]{width:62px;text-align:center}
.f{width:100%;display:block;margin:6px 0}
.b{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:9px 16px;font:700 14px Vazirmatn;cursor:pointer}
.x{background:none;color:var(--bad);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.em{text-align:center;color:var(--mu);padding:20px}
.im{width:100%;max-height:230px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.nw{cursor:pointer}
.ft{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 6px}
.ft b{color:var(--ac)}
td.tn small{display:block;text-align:right;font-weight:400;margin-top:2px}
.id{direction:ltr;unicode-bidi:isolate;font-family:Orbitron,sans-serif;letter-spacing:.5px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:2px solid var(--ac);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:7px 2px;background:none;border:0;color:var(--mu);font:700 11px/1.35 Vazirmatn;cursor:pointer}nav button span{display:block;font-size:19px}
nav button.on{color:var(--ac)}
.ob{max-width:380px;margin:0 auto;padding:40px 20px;text-align:center}
.ob img{width:140px;height:140px;border-radius:50%}
.ob h1{font:900 28px Orbitron,sans-serif;color:var(--ac);margin:12px 0}
.er{color:var(--bad);min-height:20px}
.pub{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:9;padding:13px;font-size:16px;box-shadow:0 4px 14px #0004}.msg{text-align:center;color:var(--mu);font-size:13px}
</style>
</head>

const so=(l,s)=>l.teams.map(t=>`<option value="${t.id}" ${t.id===s?'selected':''}>${E(t.n)}</option>`).join('');

function sd(l){const m={};l.teams.forEach(t=>m[t.id]={n:t.n,c:t.c||'',p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
 l.matches.forEach(x=>{if(x.hg==null||x.ag==null||!m[x.h]||!m[x.a])return;const H=m[x.h],A=m[x.a];H.p++;A.p++;H.gf+=x.hg;H.ga+=x.ag;A.gf+=x.ag;A.ga+=x.hg;
  if(x.hg>x.ag){H.w++;H.pts+=3;A.l++}else if(x.hg<x.ag){A.w++;A.pts+=3;H.l++}else{H.d++;A.d++;H.pts++;A.pts++}});
 return Object.values(m).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.n.localeCompare(b.n))}

function vT(l){const r=sd(l);
 let h=`<h2>${E(l.name)}</h2>`+(r.length?`<div class=cd style="overflow-x:auto"><table><tr><th>#<th>تیم<th>بازی<th>برد<th>مس<th>باخ<th>گ‌زده<th>گ‌خورده<th>تف<th>امت</tr>`+r.map((x,i)=>`<tr><td>${i+1}<td class=tn>${E(x.n)}${x.c?`<small>🧑‍💼 ${E(x.c)}</small>`:''}<td>${x.p}<td>${x.w}<td>${x.d}<td>${x.l}<td>${x.gf}<td>${x.ga}<td dir=ltr>${x.gf-x.ga}<td class=pt>${x.pts}</tr>`).join('')+'</table></div><div class=mu>ترتیب: امتیاز، تفاضل گل، گل زده، نام تیم</div>':'<p class=em>هنوز تیمی ثبت نشده است.</p>');
 if(A)h+=`<div class=cd><h3>نام لیگ</h3><div class=rw><input style="flex:1" value="${E(l.name)}" onchange="rl(this.value)"><button class=x onclick="dl()">حذف لیگ</button></div></div><div class=cd><h3>تیم‌ها</h3>`+l.teams.map(t=>`<div class=rw><input style="flex:1" value="${E(t.n)}" onchange="rn('${t.id}',this.value)"><input style="flex:1" placeholder="نام سرمربی" value="${E(t.c||'')}" onchange="rc('${t.id}',this.value)"><button class=x onclick="dt('${t.id}')">حذف</button></div>`).join('')+`<div class=rw><input id=nt style="flex:1" placeholder="نام تیم جدید"><input id=ntc style="flex:1" placeholder="نام سرمربی"><button class=b onclick="at()">افزودن تیم</button></div></div>`;
 return h}

const evs=m=>(m.ev||[]).map((e,i)=>({e,i})).sort((a,b)=>(+a.e.m||0)-(+b.e.m||0)).map(({e,i})=>`<div class=rw>${IC[e.t]} <span>${E(e.p)}</span><small>${e.m!==''&&e.m!=null?E(e.m)+"'":''}</small>${A?`<button class=x onclick="de('${m.id}',${i})">✕</button>`:''}</div>`).join('')||'<p class=em>رویدادی ثبت نشده است.</p>';

const admM=(m,f)=>`<div class=rw>${f?'':`<input type=number min=0 max=99 dir=ltr value="${m.hg??''}" onchange="sc('${m.id}','hg',this.value)"><span>-</span><input type=number min=0 max=99 dir=ltr value="${m.ag??''}" onchange="sc('${m.id}','ag',this.value)">`}<input type=datetime-local value="${m.dt||''}" onchange="sc('${m.id}','dt',this.value)"></div>`+(f?'':`<small>نتیجه وقتی حساب می‌شود که هر دو عدد پر باشد.</small><div class=rw><select id=et>${Object.keys(IC).map(k=>`<option value=${k}>${IC[k]}</option>`).join('')}</select><input id=ep placeholder="نام بازیکن"><input id=em type=number min=0 max=130 placeholder="دقیقه"><button class=b onclick="ae('${m.id}')">ثبت</button></div>`)+`<button class=x onclick="dm('${m.id}')">حذف بازی</button>`;

function vM(l,mo){const f=mo==='f',pl=m=>m.hg!=null&&m.ag!=null;
 const ms=l.matches.filter(m=>f?!pl(m):A||pl(m)).sort((a,b)=>f?(a.dt||'z').localeCompare(b.dt||'z'):(b.dt||'').localeCompare(a.dt||''));
 let h=`<h2>${f?'لیست بازی‌ها':'نتایج'}</h2>`+(A?`<div class=mu>${f?'برای ویرایش تاریخ یا حذف، روی بازی بزنید.':'برای ثبت نتیجه و رویدادها، روی بازی بزنید.'}</div>`:'');
 h+=ms.map(m=>`<div class=cd><div class=m onclick="tg('${m.id}')"><b>${E(tn(l,m.h))}</b><span class=sc dir=ltr>${pl(m)?m.hg+' - '+m.ag:'VS'}</span><b>${E(tn(l,m.a))}</b></div><div class=mu>${fd(m.dt)}</div>`+(op===m.id?`<div class=ev>${f?'':evs(m)}${A?admM(m,f):''}</div>`:'')+'</div>').join('')||`<p class=em>${f?'بازی برنامه‌ریزی‌شده‌ای نیست.':'هنوز نتیجه‌ای ثبت نشده است.'}</p>`;
 if(A&&f)h+=l.teams.length>1?`<div class=cd><h3>بازی جدید</h3><div class=rw><select id=mh>${so(l)}</select><span>در برابر</span><select id=ma>${so(l)}</select></div><div class=rw><input type=datetime-local id=md><button class=b onclick="am()">افزودن بازی</button></div></div>`:'<p class=em>برای ثبت بازی، اول در تب جدول حداقل دو تیم اضافه کنید.</p>';
 return h}

function vP(l,k){const o=k==='g'?'a':'g',r=[...l.players].sort((a,b)=>b[k]-a[k]||b[o]-a[o]||a.n.localeCompare(b.n));
 let h=r.length?'<div class=cd>'+r.map((p,i)=>`<div class=rw><b class=rk>${i+1}</b><span style="flex:1">${E(p.n)} <small>${E(tn(l,p.t))}</small></span>${A?`<input type=number min=0 dir=ltr title="گل" value="${p.g}" onchange="pv('${p.id}','g',this.value)"><input type=number min=0 dir=ltr title="پاس‌گل" value="${p.a}" onchange="pv('${p.id}','a',this.value)"><button class=x onclick="dp('${p.id}')">✕</button>`:`<b class=pt>${p[k]}</b>`}</div>`).join('')+'</div>':'<p class=em>هنوز بازیکنی ثبت نشده است.</p>';
 if(A)h+=`<div class=cd><h3>بازیکن جدید</h3><div class=rw><input id=pn placeholder="نام بازیکن"><select id=pt>${so(l)}</select></div><div class=rw><input id=pg type=number min=0 value=0 title="گل"><input id=pa type=number min=0 value=0 title="پاس‌گل"><button class=b onclick="ap()">افزودن</button></div><small>ستون اول گل، ستون دوم پاس‌گل</small></div>`;
 return h}

const newL=()=>`<div class=cd><h3>ساخت لیگ</h3><div class=rw><input id=ln style="flex:1" placeholder="نام لیگ"><button class=b onclick="al()">ساخت لیگ</button></div></div>`;
const noL=()=>A?newL():'<p class=em>هنوز لیگی ساخته نشده است.</p>';
function body(){const l=L();if(nav==='n')return vN();if(!l)return noL();return nav==='t'?vT(l):nav==='m'?vM(l,'f'):nav==='r'?vM(l,'r'):vP(l,nav)}

function vN(){if(post){const n=S.news.find(x=>x.id===post);if(n)return `<button class=x onclick="post=null;R()">بازگشت</button><div class=cd>${n.img?`<img class=im src="${n.img}">`:''}<h2>${E(n.title)}</h2><div class=mu>${fd(n.ts)}</div><p style="white-space:pre-wrap;line-height:1.9">${E(n.body)}</p>${A?`<button class=x onclick="dn('${n.id}')">حذف خبر</button>`:''}</div>`}
 let h=[...S.news].sort((a,b)=>b.ts-a.ts).map(n=>`<div class="cd nw" onclick="post='${n.id}';R()">${n.img?`<img class=im src="${n.img}">`:''}<h3>${E(n.title)}</h3><div class=mu>${fd(n.ts)}</div></div>`).join('')||'<p class=em>هنوز خبری منتشر نشده است.</p>';
 if(A)h=`<div class=cd><h3>خبر جدید</h3><input id=nti class=f placeholder="تیتر"><textarea id=nb class=f rows=4 placeholder="متن خبر"></textarea><input type=file accept="image/*" onchange="pi(this.files[0])"><div class=rw><button class=b onclick="an()">انتشار خبر</button></div></div>`+h;
 return h}

const vU=()=>`<div class=cd><h3>کاربران (${users.length})</h3>`+(users.map(u=>`<div class=rw><b>${E(u.n)}</b><small dir=ltr>${E(u.i)}</small></div>`).join('')||'<p class=em>هنوز کسی وارد نشده است.</p>')+'</div>';

const NAV=[['t','📊','جدول'],['g','🥇','آقای گل'],['a','👟','پاس‌گل'],['m','📅','بازی‌ها'],['r','✅','نتایج'],['n','📰','اخبار']];
function R(){const a=$('#app');
 if(!me){a.innerHTML=`<div class=ob><img src="${IMG}"><h1>PES CLASSIC</h1><div class="mu id" style="margin:-6px 0 8px">pes_classic_eitaa</div><input id=on class=f placeholder="لقب"><input id=oi class=f dir=ltr placeholder="آیدی ایتا (مثل @name)"><button class=b onclick="ob()">ورود به اپ</button><p class=er>${E(err)}</p></div>`;return}
 a.innerHTML=`<header><img src="${IMG}"><h1>PES CLASSIC</h1><button onclick="adm()">${A?'🔓':'🔒'}</button><button onclick="tt()">🌓</button></header><main>${askTk?tkBox():''}${body()}<div class=ft>ساخته شده توسط <b>تیم کلاسیک ایتا</b><br><span class=id>pes_classic_eitaa</span></div><div class=msg>${E(msg)}</div></main>${A&&dirty?'<button class="b pub" onclick="pubS()">ذخیره و انتشار برای همه</button>':''}<nav>${NAV.map(t=>`<button class="${nav===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`}

function tt(){const n=document.documentElement.dataset.t==='n'?'d':'n';document.documentElement.dataset.t=n;LS.set('th',n)}
function go(n){nav=n;post=null;op=null;R();scrollTo(0,0)}
function ob(){const n=$('#on').value.trim().replace(/\s+/g,' '),i=$('#oi').value.trim();if(!n||!i){err='هر دو کادر را پر کنید.';R();return}me={n,i};LS.set('me',JSON.stringify(me));err='';R()}

function al(){if(S.leagues.length)return;const n=$('#ln').value.trim();if(!n)return alert('نام لیگ را وارد کنید.');const l={id:U(),name:n,teams:[],matches:[],players:[]};S.leagues.push(l);lg=l.id;ch()}
function rl(v){v=v.trim();if(!v){alert('نام لیگ نمی‌تواند خالی باشد.');R();return}L().name=v;ch()}
function dl(){if(!confirm('لیگ با همه‌ی تیم‌ها، بازی‌ها و بازیکنان حذف شود؟'))return;S.leagues=[];lg=null;ch()}
function at(){const v=$('#nt').value.trim(),l=L();if(!v)return;if(l.teams.some(t=>t.n.toLowerCase()===v.toLowerCase()))return alert('این تیم قبلاً اضافه شده است.');l.teams.push({id:U(),n:v,c:$('#ntc').value.trim()});ch()}
function rc(id,v){L().teams.find(t=>t.id===id).c=v.trim();ch()}
function rn(id,v){v=v.trim();const l=L();if(!v||l.teams.some(t=>t.id!==id&&t.n.toLowerCase()===v.toLowerCase())){alert('نام تیم خالی یا تکراری است.');R();return}l.teams.find(t=>t.id===id).n=v;ch()}
function dt(id){if(!confirm('با حذف تیم، بازی‌ها و بازیکنان آن هم حذف می‌شوند. ادامه می‌دهید؟'))return;const l=L();l.teams=l.teams.filter(t=>t.id!==id);l.matches=l.matches.filter(m=>m.h!==id&&m.a!==id);l.players=l.players.filter(p=>p.t!==id);ch()}
function am(){const h=$('#mh').value,a=$('#ma').value;if(h===a)return alert('دو تیم باید متفاوت باشند.');L().matches.push({id:U(),h,a,hg:null,ag:null,dt:$('#md').value,ev:[]});ch()}
function sc(id,k,v){const m=L().matches.find(x=>x.id===id);m[k]=k==='dt'?v:v===''?null:Math.min(99,Math.max(0,+v|0));ch()}
function tg(id){op=op===id?null:id;R()}
function ae(id){const p=$('#ep').value.trim(),mn=$('#em').value;if(!p)return alert('نام بازیکن را وارد کنید.');if(mn!==''&&(+mn<0||+mn>130))return alert('دقیقه باید بین ۰ تا ۱۳۰ باشد.');L().matches.find(x=>x.id===id).ev.push({t:$('#et').value,p,m:mn});ch()}
function de(id,i){L().matches.find(x=>x.id===id).ev.splice(i,1);ch()}
function dm(id){if(!confirm('این بازی حذف شود؟'))return;const l=L();l.matches=l.matches.filter(x=>x.id!==id);op=null;ch()}
function ap(){const n=$('#pn').value.trim(),l=L();if(!n)return alert('نام بازیکن را وارد کنید.');if(!l.teams.length)return alert('اول تیم اضافه کنید.');l.players.push({id:U(),n,t:$('#pt').value,g:Math.max(0,+$('#pg').value|0),a:Math.max(0,+$('#pa').value|0)});ch()}
function pv(id,k,v){L().players.find(p=>p.id===id)[k]=Math.max(0,+v|0);ch()}
function dp(id){const l=L();l.players=l.players.filter(p=>p.id!==id);ch()}
function pi(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);pend=c.toDataURL('image/jpeg',.7)};i.src=r.result};r.readAsDataURL(f)}
function an(){const t=$('#nti').value.trim();if(!t)return;S.news.push({id:U(),title:t,body:$('#nb').value,img:pend,ts:Date.now()});pend=null;ch()}
function dn(id){S.news=S.news.filter(n=>n.id!==id);post=null;ch()}

function build(st){return '<!doctype html><html lang="fa" dir="rtl" data-t="d"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PES Classic</title><link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"><style id="css">'+document.getElementById('css').textContent+'</style></head><body><div id="app"></div><script id="state" type="application/json">'+JSON.stringify(st).replace(/</g,'\\u003c')+'<'+'/script><script id="code">'+document.getElementById('code').textContent+'<'+'/script></body></html>'}
const GH=(()=>{const h=location.hostname,p=location.pathname.split('/').filter(Boolean);return h.endsWith('.github.io')?{o:h.split('.')[0],r:p[0]||h}:null})();
const API=()=>`https://api.github.com/repos/${GH.o}/${GH.r}/contents/data.json`;
let last='';
async function load(){if(!GH)return;let t=null;try{const r=await fetch(API()+'?t='+Date.now(),{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(r.ok)t=await r.text()}catch(e){}
 if(t==null){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok)t=await r.text()}catch(e){}}
 if(t==null||t===last)return;try{S=JSON.parse(t);last=t;R()}catch(e){}}
async function pubS(){const tk=LS.get('gt');if(!GH||!tk){msg='ابتدا با دکمه قفل وارد شوید.';R();return}msg='در حال ذخیره...';R();
 const H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
 try{let sha;const g=await fetch(API(),{headers:H,cache:'no-store'});if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw g.status;
  const body=JSON.stringify(S),pr=await fetch(API(),{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'update data',content:btoa(unescape(encodeURIComponent(body))),sha})});
  if(!pr.ok)throw pr.status;last=body;dirty=false;msg='ذخیره شد و برای همه به‌روز شد ✅'}
 catch(e){if(e===401||e===403||e===404)LS.set('gt','');msg='ذخیره نشد ('+e+'). توکن یا دسترسی آن را بررسی کنید و دوباره وارد شوید.'}R()}
let askTk=0;
const tkBox=()=>askTk===2?`<div class=cd><h3>ویرایش زنده</h3><p class=msg>ویرایش فقط روی آدرس github.io کار می‌کند. لینک سایت را در مرورگر باز کنید.</p><button class=x onclick="askTk=0;R()">بستن</button></div>`:`<div class=cd><h3>ورود ادمین</h3><small>توکن گیت‌هاب را اینجا paste کنید.</small><input id=tki class=f dir=ltr placeholder="github_pat_..."><div class=rw><button class=b onclick="stk()">ورود</button><button class=x onclick="askTk=0;R()">بستن</button></div></div>`;
async function enter(){A=true;dirty=false;last='';askTk=0;await load();R()}
function stk(){const v=$('#tki').value.trim();if(!v)return;LS.set('gt',v);enter()}
function adm(){if(A){A=false;R();return}if(!GH){askTk=2;R();scrollTo(0,0);return}if(!LS.get('gt')){askTk=1;R();scrollTo(0,0);return}enter()}
R();
load();setInterval(()=>{if(!A)load()},60000);
</script>
</body>
</html>
